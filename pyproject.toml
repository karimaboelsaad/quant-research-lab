[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-system"
version = "0.1.0"
description = "Chronological quantitative research and walk-forward backtesting project"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "statsmodels>=0.14,<1",
    "yfinance>=1.5,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
